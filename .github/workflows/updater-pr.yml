name: Windows addon updater

on:
  pull_request:
    branches: [main]
    paths:
      - 'updater/**'
      - 'scripts/package.py'
      - 'scripts/release_changes.py'
      - '.github/workflows/updater-pr.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  updater:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - name: Build and test the optional DLL
        uses: ./updater/build
      - name: Package and verify the updater release inputs
        shell: pwsh
        run: |
          python scripts/package.py dist/SurvivorsDragonUi.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/updater-build/Release/avrt.dll dist/avrt.dll
          python updater/release_manifest.py dist/SurvivorsDragonUi.zip '${{ github.event.pull_request.head.sha }}' --dll dist/avrt.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -m unittest discover -s updater/tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
