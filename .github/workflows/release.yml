name: Package and release

on:
  push:
    branches:
      - main
    paths:
      - 'SurvivorsDragonUi.toc'
      - 'core/**'
      - 'modules/**'
      - 'media/**'
      - 'packaging/runtime-files.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survivorsdragonui-release-main
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select changes to the installable payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/release_changes.py

      - name: Package the addon
        if: steps.payload.outputs.payload_changed == 'true'
        run: python3 scripts/package.py dist/SurvivorsDragonUi.zip

      - name: Publish this commit's release
        if: steps.payload.outputs.payload_changed == 'true'
        shell: bash
        run: |
          tag="build-$BUILD_SHA"
          archive="dist/SurvivorsDragonUi.zip"
          notes="dist/release-notes.md"
          python3 scripts/release_notes.py "$BUILD_SHA" "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "$archive" \
              --target "$BUILD_SHA" \
              --title "SurvivorsDragonUi (${BUILD_SHA:0:7})" \
              --notes-file "$notes" \
              --latest=false
          fi

          # A docs-only main push must not block this runtime build becoming
          # Latest. An older rerun must not replace a newer published build.
          latest_error="$RUNNER_TEMP/latest-release-error.txt"
          if latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>"$latest_error")"; then
            comparison="$(gh api "repos/$GH_REPO/compare/$latest_tag...$BUILD_SHA" --jq '.status')"
          elif [[ "$(cat "$latest_error")" == *"HTTP 404"* ]]; then
            comparison="ahead"
          else
            cat "$latest_error" >&2
            exit 1
          fi

          case "$comparison" in
            ahead|identical) gh release edit "$tag" --latest ;;
            behind|diverged) echo "Keeping the newer Latest release." ;;
            *) echo "Unexpected commit comparison: $comparison" >&2; exit 1 ;;
          esac
